{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="col-md-6 col-lg-5 mx-auto pt-4">
  <span class="eyebrow">Welcome back</span>
  <h2 class="mt-1">Log in</h2>
  <div class="amber-rule"></div>
  <div class="panel">
    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div class="mb-2">{{ field.label_tag }} {{ field }} {{ field.errors }}</div>
      {% endfor %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary mt-2">Log in</button>
    </form>
  </div>
  <p class="mt-3">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
