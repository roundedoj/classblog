{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>My Articles</h1>
  <a href="{% url 'post_create' %}" class="btn btn-primary">+ New Article</a>
</div>
<table class="table table-striped bg-white">
  <thead><tr><th>Title</th><th>Status</th><th>Date</th><th></th></tr></thead>
  <tbody>
  {% for post in posts %}
    <tr>
      <td><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></td>
      <td>{{ post.get_status_display }}</td>
      <td>{{ post.created_at|date:"M d, Y" }}</td>
      <td>
        <a href="{% url 'post_edit' post.slug %}" class="btn btn-sm btn-outline-primary">Edit</a>
        <a href="{% url 'post_delete' post.slug %}" class="btn btn-sm btn-outline-danger">Delete</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="4">You haven't written anything yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
