{% extends 'base.html' %}
{% block content %}
<div class="col-lg-6 mx-auto text-center pt-5">
  <div class="panel">
    <span class="eyebrow" style="color:var(--brick);">Confirm</span>
    <h2 class="mt-1">Delete "{{ object.title }}"?</h2>
    <p class="mb-4">This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
